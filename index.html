    <!--
      Static SEO fallback.

      this file, so the tags below must stay in the source HTML. React hoists the
      route-managed copies into <head> on mount (see src/routes/__root.tsx), so
      every tag here is marked data-static-seo and removed at boot by
      stripStaticHeadFallback() in src/lib/seo.ts — the live DOM then holds
      exactly one title, one description and one set of JSON-LD blocks.
    -->

      data-static-seo
      name="description"
      content="Learn architecture and interior design from practising architects — AutoCAD, SketchUp, 3D visualisation and AI design workflows, live projects, internship certificate and lifetime access. Online and classroom training in Kozhikode, Kerala."
    />

      data-static-seo
      name="keywords"
      content="architecture course in Kerala, architecture internship Kozhikode, architecture design course Kerala, interior design course Kozhikode, interior design training, 3D visualisation course, 3D modeling architecture, 2D drafting AutoCAD, 360 visualisation, architecture presentation, interactive design, AATT architecture, live project architecture, architecture certification, AI integration architecture, interior design course Kerala, architecture LMS, SketchUp Lumion course, architecture portfolio mentorship"
    />

      data-static-seo
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
